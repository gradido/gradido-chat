[package]
name = "gradido-chat"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Lean native chat client for Gradido communities"

# The library holds everything; `src/main.rs` is only the desktop entry.
# Android wants a `cdylib` with an `android_main`, iOS a `staticlib`:
# add the crate type here and the entry in `src/lib.rs` when those targets come.
[lib]
name = "gradido_chat"
path = "src/lib.rs"

[[bin]]
name = "gradido-chat"
path = "src/main.rs"

[dependencies]
slint = "1.18"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
keyring-core = "1"
regex-lite = "0.1.9"

# --- Desktop only: nothing below exists on a phone, see src/platform/ ---
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
open = "5"
dirs = "7"
notify-rust = "4"
rodio = { version = "0.22", default-features = false, features = ["playback"] }

# --- Credential stores, one per platform (src/platform/token_store.rs) ---
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

# macOS / iOS, when the time comes:
# [target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# apple-native-keyring-store = { version = "1", features = ["keychain"] }   # iOS: "protected"
#
# Android:
# [target.'cfg(target_os = "android")'.dependencies]
# android-native-keyring-store = "1"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
